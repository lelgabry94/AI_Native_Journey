<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Journey Quiz - Your Quest Awaits</title>
  <style>
    body {
      background: #000000;
      color: #fff5f0;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 2em;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    h1 {
      font-size: 2.5em;
      animation: glow 2s ease-in-out infinite alternate;
      margin-bottom: 1em;
    }

    h2 {
      font-size: 2em;
      animation: glow 2s ease-in-out infinite alternate;
      margin-bottom: 1em;
    }

    .quiz-section {
      background-color: rgba(0, 0, 50, 0.3);
      border-radius: 15px;
      padding: 2em;
      margin: 1em 0;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      border: 1px solid rgba(0, 255, 255, 0.2);
    }

    .lesson-text {
      text-align: left;
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 2em;
      padding: 1em;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border-left: 4px solid #00ffff;
    }

    .question-container {
      text-align: left;
      margin: 2em 0;
    }

    .question {
      font-size: 1.3em;
      margin-bottom: 1.5em;
      color: #00ffff;
      font-weight: bold;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 1em;
    }

    .option {
      background-color: rgba(0, 255, 255, 0.1);
      border: 2px solid rgba(0, 255, 255, 0.3);
      border-radius: 10px;
      padding: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.1em;
    }

    .option:hover {
      background-color: rgba(0, 255, 255, 0.2);
      border-color: #00ffff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }

    .option.selected {
      background-color: rgba(0, 255, 255, 0.3);
      border-color: #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
    }

    .option.correct {
      background-color: rgba(0, 255, 0, 0.3);
      border-color: #00ff00;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.7);
    }

    .option.incorrect {
      background-color: rgba(255, 0, 0, 0.3);
      border-color: #ff0000;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
    }

    .explanation {
      margin-top: 1.5em;
      padding: 1em;
      background-color: rgba(255, 255, 0, 0.1);
      border-radius: 10px;
      border-left: 4px solid #ffff00;
      font-style: italic;
    }

    .btn {
      display: inline-block;
      margin: 1em 0.5em;
      padding: 0.8em 1.5em;
      font-size: 1.2em;
      background: #00ffff;
      color: #000014;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 15px #00ffff;
      transition: all 0.3s ease;
      text-decoration: none;
      font-family: 'Courier New', monospace;
    }

    .btn:hover {
      background: #0ff;
      box-shadow: 0 0 25px #00ffff;
      transform: translateY(-2px);
    }

    .btn:disabled {
      background: #666;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .score-display {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: rgba(0, 0, 50, 0.8);
      padding: 1em;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.3);
      font-size: 1.1em;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      margin: 1em 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ffff, #ff00ff);
      transition: width 0.5s ease;
      border-radius: 5px;
    }

    .result-message {
      font-size: 1.5em;
      margin: 1em 0;
      padding: 1em;
      border-radius: 10px;
      animation: pulse 1s ease-in-out;
    }

    .correct-answer {
      background-color: rgba(0, 255, 0, 0.2);
      border: 2px solid #00ff00;
    }

    .incorrect-answer {
      background-color: rgba(255, 0, 0, 0.2);
      border: 2px solid #ff0000;
    }

    .text-input {
      background-color: rgba(0, 255, 255, 0.1);
      border: 2px solid rgba(0, 255, 255, 0.3);
      border-radius: 10px;
      padding: 1em;
      color: #fff5f0;
      font-size: 1.1em;
      font-family: 'Courier New', monospace;
      width: 100%;
      max-width: 400px;
      margin: 1em 0;
    }

    .text-input:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff;
      }
      to {
        text-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff;
      }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .hidden {
      display: none;
    }

    .fade-in {
      animation: fadeIn 1s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="score-display">
    <div>Score: <span id="currentScore">0</span> / <span id="totalQuestions">0</span></div>
    <div>Total Score: <span id="globalScore">0</span> / <span id="totalQuestionsAsked">0</span></div>
  </div>

  <div class="container">
    <div id="mainMenu" class="quiz-section fade-in">
      <h1>🌟 AI Journey Quiz 🌟</h1>
      <div id="personalizedWelcome"></div>
      <p>Welcome, brave explorer! Choose your path of learning:</p>
      
      <div class="options">
        <button class="btn" onclick="startQuiz('glowing-forest')">🌲 Glowing Forest - Python Basics</button>
        <button class="btn" onclick="startQuiz('temple-technology')">🏛️ Temple of Technology - Machine Learning</button>
        <button class="btn" onclick="startQuiz('crystal-caves')">💎 Crystal Caves - Data Structures</button>
        <button class="btn" onclick="startQuiz('ethereal-plains')">🌌 Ethereal Plains - Advanced Concepts</button>
        <button class="btn" onclick="startQuiz('mastery')" style="background: linear-gradient(45deg, #ff00ff, #00ffff);">🏆 Grand Mastery Quiz - All Realms</button>
      </div>
      
      <br>
      <a class="btn" href="ai_journey.html" style="margin-top: 1em;">← Return to Portal</a>
    </div>

    <div id="quizContainer" class="hidden">
      <div class="quiz-section">
        <h2 id="quizTitle">Quiz Title</h2>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div id="lessonContainer" class="lesson-text hidden"></div>
        
        <div id="questionContainer" class="question-container hidden">
          <div class="question" id="questionText"></div>
          <div class="options" id="optionsContainer"></div>
          <div id="textInputContainer" class="hidden">
            <input type="text" class="text-input" id="textInput" placeholder="Type your answer here...">
            <br>
            <button class="btn" onclick="submitTextAnswer()">Submit Answer</button>
          </div>
        </div>
        
        <div id="explanationContainer" class="explanation hidden"></div>
        <div id="resultMessage" class="result-message hidden"></div>
        
        <div id="navigationButtons" class="hidden">
          <button class="btn" id="nextButton" onclick="nextQuestion()">Next Question</button>
          <button class="btn" id="finishButton" onclick="finishQuiz()" style="display: none;">Finish Quiz</button>
        </div>
      </div>
    </div>

    <div id="resultsContainer" class="quiz-section hidden">
      <h2>🎉 Quiz Results 🎉</h2>
      <div id="finalResults"></div>
      <button class="btn" onclick="returnToMainMenu()">Return to Main Menu</button>
    </div>
  </div>

  <!-- Background music -->
  <audio id="bg-music" autoplay loop>
    <source src="audio/aylex-tension-rising.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

            options: ["String", "Integer", "Boolean", "Pixel"],

    // Global variables
    let currentQuiz = null;
    let currentQuestionIndex = 0;
    let currentScore = 0;
    let globalScore = 0;
    let totalQuestionsAsked = 0;
    let selectedAnswer = null;
    let questions = [];
    let userName = "";

    // Initialize the quiz and handle URL parameters
    function initializeQuiz() {
      // Get name from URL
      const params = new URLSearchParams(window.location.search);
      userName = params.get('name') || "explorer";
      
      // Create personalized welcome
      const welcomeDiv = document.getElementById('personalizedWelcome');
      if (userName && userName !== "explorer") {
        welcomeDiv.innerHTML = `
          <div style="margin-bottom: 1.5em; padding: 1em; background-color: rgba(0, 255, 255, 0.1); border-radius: 10px; border-left: 4px solid #00ffff;">
            <h3 style="margin: 0 0 0.5em 0; color: #00ffff;">Welcome, ${userName}! ✨</h3>
            <p style="margin: 0; font-style: italic;">The prophecy has led you here. Your journey through the realm of code continues with these sacred trials of knowledge...</p>
          </div>
        `;
      }
    }

    // Initialize the quiz
    function startQuiz(quizKey) {
      currentQuiz = quizData[quizKey];
      questions = [...currentQuiz.questions];
      currentQuestionIndex = 0;
      currentScore = 0;
      selectedAnswer = null;
      
      // Shuffle questions
      for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questions[i], questions[j]] = [questions[j], questions[i]];
      }
      
      showQuiz();
      updateScoreDisplay();
      
      if (currentQuiz.lesson && currentQuiz.lesson.length > 0) {
        showLesson();
      } else {
        showQuestion();
      }
    }

    function showQuiz() {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('quizContainer').classList.remove('hidden');
      document.getElementById('resultsContainer').classList.add('hidden');
      document.getElementById('quizTitle').textContent = currentQuiz.title;
    }

    function showLesson() {
      const lessonContainer = document.getElementById('lessonContainer');
      lessonContainer.classList.remove('hidden');
      lessonContainer.innerHTML = currentQuiz.lesson.map(line => `<p>${line}</p>`).join('');
      
      document.getElementById('questionContainer').classList.add('hidden');
      document.getElementById('explanationContainer').classList.add('hidden');
      document.getElementById('resultMessage').classList.add('hidden');
      document.getElementById('navigationButtons').classList.add('hidden');
      
      setTimeout(() => {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn';
        nextBtn.textContent = 'Begin Quiz';
        nextBtn.onclick = () => {
          lessonContainer.classList.add('hidden');
          showQuestion();
        };
        lessonContainer.appendChild(nextBtn);
      }, 2000);
    }

    function showQuestion() {
      const question = questions[currentQuestionIndex];
      document.getElementById('questionText').textContent = question.question;
      
      updateProgress();
      
      if (question.options) {
        showMultipleChoice(question);
      } else {
        showTextInput();
      }
      
      document.getElementById('questionContainer').classList.remove('hidden');
      document.getElementById('explanationContainer').classList.add('hidden');
      document.getElementById('resultMessage').classList.add('hidden');
      document.getElementById('navigationButtons').classList.add('hidden');
    }

    function showMultipleChoice(question) {
      const optionsContainer = document.getElementById('optionsContainer');
      const textInputContainer = document.getElementById('textInputContainer');
      
      optionsContainer.classList.remove('hidden');
      textInputContainer.classList.add('hidden');
      
      optionsContainer.innerHTML = question.options.map((option, index) => 
        `<div class="option" onclick="selectOption(${index})">${index + 1}. ${option}</div>`
      ).join('');
    }

    function showTextInput() {
      const optionsContainer = document.getElementById('optionsContainer');
      const textInputContainer = document.getElementById('textInputContainer');
      
      optionsContainer.classList.add('hidden');
      textInputContainer.classList.remove('hidden');
      document.getElementById('textInput').value = '';
      document.getElementById('textInput').focus();
    }

    function selectOption(index) {
      // Remove previous selections
      document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
      
      // Select new option
      document.querySelectorAll('.option')[index].classList.add('selected');
      selectedAnswer = index;
      
      // Enable submit button
      const submitBtn = document.createElement('button');
      submitBtn.className = 'btn';
      submitBtn.textContent = 'Submit Answer';
      submitBtn.onclick = submitAnswer;
      submitBtn.style.marginTop = '1em';
      
      // Remove existing submit button if any
      const existingBtn = document.querySelector('#optionsContainer .btn');
      if (existingBtn) existingBtn.remove();
      
      document.getElementById('optionsContainer').appendChild(submitBtn);
    }

    function submitAnswer() {
      const question = questions[currentQuestionIndex];
      let isCorrect = false;
      
      if (question.options) {
        const selectedOption = question.options[selectedAnswer];
        isCorrect = selectedOption.toLowerCase() === question.answer.toLowerCase();
        
        // Show correct/incorrect styling
        document.querySelectorAll('.option').forEach((opt, index) => {
          if (index === selectedAnswer) {
            opt.classList.add(isCorrect ? 'correct' : 'incorrect');
          } else if (question.options[index].toLowerCase() === question.answer.toLowerCase()) {
            opt.classList.add('correct');
          }
        });
      }
      
      showResult(isCorrect, question);
    }

    function submitTextAnswer() {
      const question = questions[currentQuestionIndex];
      const userAnswer = document.getElementById('textInput').value.trim().toLowerCase();
      const isCorrect = userAnswer === question.answer.toLowerCase();
      
      showResult(isCorrect, question);
    }

    function showResult(isCorrect, question) {
      const resultMessage = document.getElementById('resultMessage');
      const explanationContainer = document.getElementById('explanationContainer');
      
      if (isCorrect) {
        currentScore++;
        resultMessage.textContent = '✨ Correct! Your insight glows brighter! ✨';
        resultMessage.className = 'result-message correct-answer';
      } else {
        resultMessage.textContent = `Alas, that is incorrect. The true answer was: ${question.answer}`;
        resultMessage.className = 'result-message incorrect-answer';
      }
      
      if (question.explanation) {
        explanationContainer.innerHTML = `<strong>💡 Explanation:</strong> ${question.explanation}`;
        explanationContainer.classList.remove('hidden');
      }
      
      resultMessage.classList.remove('hidden');
      
      // Show navigation buttons
      const navigationButtons = document.getElementById('navigationButtons');
      navigationButtons.classList.remove('hidden');
      
      if (currentQuestionIndex === questions.length - 1) {
        document.getElementById('nextButton').style.display = 'none';
        document.getElementById('finishButton').style.display = 'inline-block';
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      selectedAnswer = null;
      showQuestion();
    }

    function finishQuiz() {
      globalScore += currentScore;
      totalQuestionsAsked += questions.length;
      
      const resultsContainer = document.getElementById('resultsContainer');
      const finalResults = document.getElementById('finalResults');
      
      let resultHTML = `
        <h3>Quiz Complete!</h3>
        <p>You answered <strong>${currentScore}</strong> out of <strong>${questions.length}</strong> questions correctly!</p>
        <p>Your total journey wisdom score: <strong>${globalScore}</strong> out of <strong>${totalQuestionsAsked}</strong> questions answered correctly so far.</p>
      `;
      
      if (currentScore === questions.length) {
        resultHTML += '<p style="color: #00ff00; font-size: 1.3em;">🌟 A true master of these arcane arts! 🌟</p>';
      } else if (currentScore > questions.length / 2) {
        resultHTML += '<p style="color: #00ffff; font-size: 1.3em;">✨ Your understanding grows strong! ✨</p>';
      } else {
        resultHTML += '<p style="color: #ffff00; font-size: 1.3em;">💪 Fear not, every challenge is a step towards mastery. 💪</p>';
      }
      
      if (userName && userName !== "explorer") {
        resultHTML += `<p style="margin-top: 1em; font-style: italic;">Continue your journey, ${userName}. The realm of code awaits your next adventure!</p>`;
      }
      
      finalResults.innerHTML = resultHTML;
      
      document.getElementById('quizContainer').classList.add('hidden');
      resultsContainer.classList.remove('hidden');
      
      updateScoreDisplay();
    }

    function returnToMainMenu() {
      document.getElementById('mainMenu').classList.remove('hidden');
      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('resultsContainer').classList.add('hidden');
    }

    function updateProgress() {
      const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
    }

    function updateScoreDisplay() {
      document.getElementById('currentScore').textContent = currentScore;
      document.getElementById('totalQuestions').textContent = questions.length;
      document.getElementById('globalScore').textContent = globalScore;
      document.getElementById('totalQuestionsAsked').textContent = totalQuestionsAsked;
    }

    // Handle text input submission with Enter key
    document.getElementById('textInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        submitTextAnswer();
      }
    });

    // Force music play on user interaction (for autoplay restrictions)
    window.addEventListener('click', () => {
      const audio = document.getElementById('bg-music');
      if (audio && audio.paused) {
        audio.play().catch(err => console.warn('Audio blocked:', err));
      }
    });

    // Initialize when page loads
    document.addEventListener('DOMContentLoaded', function() {
      initializeQuiz();
    });
  </script>
</body>
