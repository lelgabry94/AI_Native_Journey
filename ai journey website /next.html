<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to the Realm of Code</title>
  <style>
    body {
      background: #000000;
      color: #fff5f0;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 3em;
    }

    h1 {
      font-size: 3em;
      animation: glow 2s ease-in-out infinite alternate;
    }

    h2 {
      font-size: 2.5em;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p {
      font-size: 1.2em;
      margin-top: 1em;
    }

    .message {
      margin-top: 2em;
      padding: 2em;
      border-radius: 15px;
      background-color: rgba(0, 0, 50, 0.3);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }

    .scroll-image {
      max-width: 600px;
      width: 95%;
      margin: 1.5em auto 0;
      display: block;
      filter: drop-shadow(0 0 15px #00ffff);
      border-radius: 15px;
    }

    .button-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2em;
      gap: 2em;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 1em 2em;
      font-size: 1.3em;
      background: #00ffff;
      color: #000014;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 0 20px #00ffff;
      transition: all 0.3s ease;
      text-decoration: none;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      min-width: 250px;
      width: 250px;
      text-align: center;
      flex: 1;
    }

    .btn:hover {
      background: #0ff;
      box-shadow: 0 0 30px #00ffff;
      transform: translateY(-3px);
    }

    .btn-secondary {
      background: linear-gradient(45deg, #ff00ff, #8000ff);
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.7);
    }

    .btn-secondary:hover {
      background: linear-gradient(45deg, #ff33ff, #9933ff);
      box-shadow: 0 0 30px rgba(255, 0, 255, 0.9);
    }

    .btn-primary {
      background: linear-gradient(45deg, #00ffff, #0080ff);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
    }

    .btn-primary:hover {
      background: linear-gradient(45deg, #33ffff, #3399ff);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.9);
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff;
      }
      to {
        text-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff;
      }
    }
  </style>
</head>
<body>
  <h1></h1>
  
  <div class="message" id="messageBox">
    <!-- Personalized content will be injected here by JS -->
  </div>

  <!-- 🌌 Background mystical music -->
  <audio id="bg-music" autoplay loop>
    <source src="audio/aylex-tension-rising.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    // Get name from URL
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || "explorer";

    // Prepare personalized message
    const messageHTML = `
      <h2>Welcome to the Realm of Code</h2>
      <p>You have now been transported through the portal to a new realm — the realm of code!<br>
      The ancient oracle, revealing the path you are destined to forge:</p>
      <img src="image/scroll2.0.png" alt="Prophecy Scroll" class="scroll-image" />
      <p style="margin-top: 1.5em;">Grab your tech, ready your mind, and take your first step into the unknown...</p>
      <div class="button-container">
        <a href="ai_journey.html" class="btn btn-secondary">Back to Portal</a>
        <a href="quiz.html?name=${encodeURIComponent(name)}" class="btn btn-primary">Begin Your Learning Quest</a>
      </div>
    `;
    document.getElementById('messageBox').innerHTML = messageHTML;

    // Fairy Voice Greeting (if supported)
    if ('speechSynthesis' in window) {
      const greet = () => {
        const fairyVoice = new SpeechSynthesisUtterance(`Welcome to the Realm of Code. You have now been transported through the portal to a new realm — the realm of code! The ancient oracle, revealing the path you are destined to forge: Grab your tech, ready your mind, and take your first step into the unknown...`);
        fairyVoice.pitch = 1.5;
        fairyVoice.rate = 0.95;
        fairyVoice.volume = 1;
        const voices = speechSynthesis.getVoices();
        fairyVoice.voice = voices.find(v => v.name.includes("Princess")) || voices[0];
        speechSynthesis.speak(fairyVoice);
      };
      if (speechSynthesis.getVoices().length === 0) {
        speechSynthesis.onvoiceschanged = greet;
      } else {
        greet();
      }
    }

    // 💡 Optional: Force music play on user interaction (for autoplay restrictions)
    window.addEventListener('click', () => {
      const audio = document.getElementById('bg-music');
      if (audio && audio.paused) {
        audio.play().catch(err => console.warn('Audio blocked:', err));
      }
    });
  </script>
</body>
</html>
